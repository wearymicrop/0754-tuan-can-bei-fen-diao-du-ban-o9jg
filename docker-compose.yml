services:
  app:
    build: .
    ports:
      - "18448:8000"
    environment:
      WORKBENCH_DB: /var/lib/workbench/ledger.sqlite3
    volumes:
      - ledger:/var/lib/workbench
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 8
volumes:
  ledger:
